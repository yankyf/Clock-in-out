name: Build desktop installers

# Push a tag like v0.1.0 to build installers for macOS, Windows and Linux and
# publish them to a GitHub Release. The website's Download page links to the
# release's "latest" assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build shared + desktop
        run: |
          npm run build:shared
          npm run build -w @clock/desktop

      - name: Package installer
        working-directory: packages/desktop
        run: npx electron-builder --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            packages/desktop/release/Clock-In-Out-*.dmg
            packages/desktop/release/Clock-In-Out-*.exe
            packages/desktop/release/Clock-In-Out-*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Use the pushed tag when triggered by a tag; otherwise publish/refresh
          # a default v0.1.0 release (e.g. when run manually via "Run workflow").
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          files: artifacts/**/Clock-In-Out-*
          fail_on_unmatched_files: false
          generate_release_notes: true
