<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Clock In/Out</title>
    <style>
      :root {
        --bg: #0f172a; --panel: #1e293b; --line: #334155;
        --text: #e2e8f0; --muted: #94a3b8; --green: #34d399; --red: #f87171; --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
      .wrap { padding: 1.25rem; max-width: 460px; margin: 0 auto; }
      h1 { font-size: 1.25rem; margin: 0 0 0.25rem; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-top: 1rem; }
      label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
      input, select, button { font: inherit; padding: 0.55rem 0.7rem; border-radius: 8px; border: 1px solid var(--line); background: #0b1220; color: var(--text); width: 100%; }
      button { cursor: pointer; border: none; font-weight: 600; }
      .primary { background: var(--accent); color: #04293a; }
      .big { padding: 1.1rem; font-size: 1.1rem; }
      .clockin { background: var(--green); color: #053d2c; }
      .clockout { background: var(--red); color: #4c0d0d; }
      .row { display: flex; gap: 0.5rem; align-items: center; }
      .row > * { flex: 1; }
      .status { display: flex; align-items: center; gap: 0.5rem; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
      .dot.on { background: var(--green); }
      .dot.off { background: var(--red); }
      .error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; }
      table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 0.5rem; }
      td, th { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--line); }
      .linkbtn { background: none; color: var(--accent); width: auto; padding: 0.2rem 0; }
      .linkbtn.danger { color: var(--red); }
      .big-timer { font-size: 1.6rem; font-weight: 700; margin: 0.25rem 0; }
      .rowbetween { display: flex; align-items: center; justify-content: space-between; }
      .rowactions { white-space: nowrap; text-align: right; }
      .rowactions .linkbtn { padding: 0.2rem 0.3rem; }
      .editcard { border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>
    <script src="./renderer.js"></script>
  </body>
</html>
